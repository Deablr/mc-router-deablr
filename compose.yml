# mc-router-deablr
# Routes Minecraft players to the Deablr family servers based on the hostname
# they use to connect, so every server can share one public IP and port.
#
# Java flow:     client ──TCP 25565──▶ mc-router ──▶ backend by hostname
# Bedrock flow:  client ──UDP 19132──▶ geyser (joins mc-router as a Java client,
#                forwarding the hostname the player typed) ──▶ backend by hostname
#
# Backends:
#   - richard.deablr.com -> Richard's creative flat Paper 26.1.2 server
#   - nijika.deablr.com  -> Nijika's Paper 26.3 server
#
# All backend containers must be attached to dokploy-network and must NOT bind
# host port 25565 themselves (only mc-router binds it).

services:
  mc-router:
    image: itzg/mc-router:latest
    container_name: mc-router-deablr
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      MAPPING: |
        richard.deablr.com=richard-deablr-mc:25565
        nijika.deablr.com=nijika-deablr-mc:25565
    networks:
      - dokploy-network

  geyser:
    build: ./geyser
    container_name: geyser-deablr
    tty: true
    stdin_open: true
    restart: unless-stopped
    depends_on:
      - mc-router
    # Bedrock is UDP; neither mc-router nor Traefik can carry it, so Geyser binds it directly
    ports:
      - "19132:19132/udp"
    volumes:
      - geyser-data:/geyser
      - /opt/deablr/floodgate/key.pem:/geyser/key.pem:ro
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  geyser-data:
